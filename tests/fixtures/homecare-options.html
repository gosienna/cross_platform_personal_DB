<!doctype html><html><head><meta charset="utf-8"><title>基本資料｜居護系統（測試）</title></head><body>
<!-- Synthetic copy of 居護系統 Angular option markup (form markup only, fake data). -->
<aside><div>案件篩選</div><table><tr>
  <td><div class="radio radio-inline"><input type="radio" id="PCaseType1" value="1" formcontrolname="caseType"><label for="PCaseType1">收案中</label></div></td>
  <td><div class="radio radio-inline"><input type="radio" id="PCaseType2" value="2" formcontrolname="caseType"><label for="PCaseType2">已結案</label></div></td></tr>
  <tr><td><div class="radio radio-inline"><input type="radio" id="PCaseType3" value="3" formcontrolname="caseType"><label for="PCaseType3">未收案</label></div></td>
  <td><div class="radio radio-inline"><input type="radio" id="PCaseType4" value="4" formcontrolname="caseType"><label for="PCaseType4">全部</label></div></td></tr></table></aside>
<form><table class="table">
  <tr><th>＊身分證或護照號</th><td><label>國籍</label><div class="checkbox checkbox-inline"><input type="checkbox" id="IsCheckCId" name="IsCheckCId" formcontrolname="IsCheckCId"><label for="IsCheckCId">本國</label></div><div><input formcontrolname="CId" value="A123456789"></div></td></tr>
  <tr><th>近1年跌倒</th><td style="width:40%"><div class="radio radio-inline"><input type="radio" id="FallInYear1" value="1" name="FallInYear" formcontrolname="FallInYear" class="ng-untouched ng-pristine ng-valid"><label for="FallInYear1">無</label></div><div class="radio radio-inline"><input type="radio" id="FallInYear2" value="2" name="FallInYear" formcontrolname="FallInYear" class="ng-untouched ng-pristine ng-valid"><label for="FallInYear2">有</label></div><div style="display:inline-flex"><input kendotextbox formcontrolname="FallInYearTimes" name="FallInYearTimes"><span class="radioSpan">次</span></div></td></tr>
  <tr><th>食物</th><td><div class="radio radio-inline"><input type="radio" id="HasFoodAllergies1" value="1" name="HasFoodAllergies" formcontrolname="HasFoodAllergies" class="ng-untouched ng-pristine ng-valid"><label for="HasFoodAllergies1">無</label></div><div class="radio radio-inline"><input type="radio" id="HasFoodAllergies2" value="2" name="HasFoodAllergies" formcontrolname="HasFoodAllergies" class="ng-untouched ng-pristine ng-valid"><label for="HasFoodAllergies2">有</label></div><div class="radio radio-inline"><input type="radio" id="HasFoodAllergies3" value="3" name="HasFoodAllergies" formcontrolname="HasFoodAllergies" class="ng-untouched ng-pristine ng-valid"><label for="HasFoodAllergies3">不詳</label></div></td></tr>
  <tr><th>DNR簽署狀態</th><td><div class="radio radio-inline"><input type="radio" id="DNRStatus1" value="1" name="DNRStatus" formcontrolname="DNRStatus" class="ng-untouched ng-pristine ng-valid"><label for="DNRStatus1">未簽署</label></div><div class="radio radio-inline"><input type="radio" id="DNRStatus2" value="2" name="DNRStatus" formcontrolname="DNRStatus" class="ng-untouched ng-pristine ng-valid"><label for="DNRStatus2">已簽署</label></div></td></tr>
  <tr><th>個案類型</th><td><div class="radio radio-inline"><input type="radio" id="CaseKind1" value="1" formcontrolname="CaseKind" class="ng-untouched ng-pristine ng-valid"><label for="CaseKind1">一般</label></div><div class="radio radio-inline"><input type="radio" id="CaseKind2" value="2" formcontrolname="CaseKind" class="ng-untouched ng-pristine ng-valid"><label for="CaseKind2">安寧</label></div></td></tr>
</table>
<table class="table order">
  <tr><td><label>選擇</label></td><td><label>項目</label></td><td><label>頻率</label></td><td><label>內容</label></td></tr>
  <tr><td><i></i></td><td><label>1.更換鼻胃管</label></td><td><input formcontrolname="NgFreq"></td>
      <td><div><label>材質：</label><div class="radio radio-inline"><input type="radio" id="NgMaterial1" value="1" name="NgMaterial" formcontrolname="NgMaterial" class="ng-untouched ng-pristine ng-valid"><label for="NgMaterial1">一般塑膠</label></div><div class="radio radio-inline"><input type="radio" id="NgMaterial2" value="2" name="NgMaterial" formcontrolname="NgMaterial" class="ng-untouched ng-pristine ng-valid"><label for="NgMaterial2">矽質</label></div><div class="radio radio-inline"><input type="radio" id="NgMaterial3" value="3" name="NgMaterial" formcontrolname="NgMaterial" class="ng-untouched ng-pristine ng-valid"><label for="NgMaterial3">其他</label></div><div><input formcontrolname="NgOther"></div><div><label>管徑大小：</label><input formcontrolname="NgSize"><span>FR</span></div></div></td></tr>
  <tr><td><i></i></td><td><label>2.更換導尿管</label></td><td><input formcontrolname="FoleyFreq"></td>
      <td><div><label>材質：</label><div class="radio radio-inline"><input type="radio" id="FoleyMaterial1" value="1" name="FoleyMaterial" formcontrolname="FoleyMaterial" class="ng-untouched ng-pristine ng-valid"><label for="FoleyMaterial1">一般塑膠</label></div><div class="radio radio-inline"><input type="radio" id="FoleyMaterial2" value="2" name="FoleyMaterial" formcontrolname="FoleyMaterial" class="ng-untouched ng-pristine ng-valid"><label for="FoleyMaterial2">矽質</label></div><div class="radio radio-inline"><input type="radio" id="FoleyMaterial3" value="3" name="FoleyMaterial" formcontrolname="FoleyMaterial" class="ng-untouched ng-pristine ng-valid"><label for="FoleyMaterial3">其他</label></div><div><input formcontrolname="FoleyOther"></div></div></td></tr>
</table></form>
</body></html>
