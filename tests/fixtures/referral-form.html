<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><title>轉介單</title></head><body>
<form id="ref">
  <div><label for="pname">病人姓名</label><input id="pname" name="pname"></div>
  <div><label for="idno">身分證字號</label><input id="idno" name="idno"></div>
  <div><label for="dob">出生日期</label><input id="dob" type="date"></div>
  <div><label for="dob2">生日(民國)</label><input id="dob2" placeholder="民國年/月/日"></div>
  <div><label>生日</label><span><input type="tel" maxlength="3"><input type="tel" maxlength="2"><input type="tel" maxlength="2"></span></div>
  <div><span>性別</span><span><input type="radio" name="sex" id="sm" value="1"><label for="sm">男</label><input type="radio" name="sex" id="sf" value="2"><label for="sf">女</label></span></div>
  <div><label for="bt">血型</label><select id="bt"><option value="">請選擇</option><option>A</option><option>B</option><option>O</option><option>AB</option></select></div>
  <div><label for="tf">體溫(°F)</label><input id="tf"></div>
  <div><label for="sbp">收縮壓</label><input id="sbp" type="number"><label for="dbp">舒張壓</label><input id="dbp" type="number"></div>
  <div><label for="ph">聯絡電話</label><input id="ph" value="02-00000000"></div>
  <div><label for="refno">轉介單號</label><input id="refno"></div>
</form></body></html>
